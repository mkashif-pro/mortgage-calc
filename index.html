<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent vs. Buy Analyzer | Premium Real Estate Tool</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --gold: #d4af37;
            --dark: #0f172a;
            --light: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .luxury-badge {
            color: var(--gold);
            letter-spacing: 2px;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 5px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 10px 0;
            text-align: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        
        input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-family: 'Lato', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--gold); }

        .btn {
            background: linear-gradient(45deg, #d4af37, #b4941f);
            color: #000;
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.02); }

        .result-box {
            display: none;
            margin-top: 30px;
            background: white;
            color: var(--dark);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .big-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--dark);
            font-family: 'Playfair Display', serif;
            display: block;
            margin: 10px 0;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            display: block;
            font-weight: bold;
            margin-top: 15px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        /* CHART CONTAINER */
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            margin-top: 20px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .footer { font-size: 0.7rem; color: #475569; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>

    <div class="luxury-badge">Real Estate Investment Tool</div>
    <h1>Rent vs. Buy</h1>

    <div class="container">
        
        <div class="input-group">
            <label>Current Monthly Rent ($)</label>
            <input type="number" id="rent" value="1500" placeholder="e.g. 1500">
        </div>

        <div class="input-group">
            <label>Target House Price ($)</label>
            <input type="number" id="price" value="350000" placeholder="e.g. 350000">
        </div>

        <div class="input-group">
            <label>Interest Rate (%)</label>
            <input type="number" id="rate" value="6.5" step="0.1">
        </div>

        <button class="btn" onclick="calculate()">Analyze Investment</button>

        <div id="result" class="result-box">
            <span style="font-size:0.9rem; color:#64748b; text-transform:uppercase; letter-spacing:1px;">Est. Monthly Payment</span>
            <span class="big-number" id="mortgageDisplay">$0</span>
            
            <div class="chart-container">
                <canvas id="wealthChart"></canvas>
            </div>
            
            <p id="comparisonText" style="line-height: 1.6; font-size: 0.95rem; margin-top:20px; margin-bottom:20px; text-align: left;">
                ...
            </p>

            <a id="whatsappLink" href="#" class="whatsapp-btn">
                📲 Get Pre-Approved Now
            </a>
        </div>
    </div>

    <div class="footer">
        Powered by [Your Agency Name] • Financial data is estimation only.
    </div>

    <script>
        let myChart = null;

        function calculate() {
            // 1. Get Inputs
            let rent = parseFloat(document.getElementById('rent').value);
            let price = parseFloat(document.getElementById('price').value);
            let rate = parseFloat(document.getElementById('rate').value);

            // 2. Logic (30 Year Fixed)
            let principal = price * 0.965; // 3.5% down
            let monthlyInterest = rate / 100 / 12;
            let payments = 30 * 12;

            let x = Math.pow(1 + monthlyInterest, payments);
            let monthlyMortgage = (principal * x * monthlyInterest) / (x - 1);
            let taxes = (price * 0.012) / 12;
            let totalMonthly = monthlyMortgage + taxes;

            // 3. Wealth Projection (10 Years)
            // Renting: Money lost = Rent * 12 * 10
            let rentLost = rent * 12 * 10;
            // Buying: Equity = (Price * 1.03^10) - Remaining Loan (rough estimate)
            let futureValue = price * Math.pow(1.03, 10); // 3% appreciation
            let remainingLoan = principal * 0.80; // Paid down some principal
            let equityBuilt = futureValue - remainingLoan;

            // 4. Update UI
            document.getElementById('mortgageDisplay').innerText = "$" + Math.round(totalMonthly).toLocaleString();
            
            let diff = totalMonthly - rent;
            let msg = "";
            
            if (diff < 200) {
                msg = `✅ <b>Amazing Deal:</b> Buying costs almost the same as renting, but you build equity!`;
            } else {
                msg = `🏠 <b>Wealth Analysis:</b> Yes, buying costs more monthly, but look at the chart. In 10 years, renting burns <b>$${(rentLost/1000).toFixed(0)}k</b>. Buying creates <b>$${(equityBuilt/1000).toFixed(0)}k</b> in family wealth.`;
            }

            document.getElementById('comparisonText').innerHTML = msg;

            // 5. Update WhatsApp Link
            let waMsg = `Hi, I used the calculator. Rent: $${rent}, House Price: $${price}. I want to stop renting.`;
            document.getElementById('whatsappLink').href = `https://wa.me/?text=${encodeURIComponent(waMsg)}`;

            document.getElementById('result').style.display = "block";

            // 6. RENDER THE CHART
            renderChart(rentLost, equityBuilt);
        }

        function renderChart(rentLost, equityBuilt) {
            const ctx = document.getElementById('wealthChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy(); // Clear old chart
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Renting (10 Yrs)', 'Buying (10 Yrs)'],
                    datasets: [{
                        label: 'Financial Impact ($)',
                        data: [rentLost, equityBuilt],
                        backgroundColor: [
                            'rgba(239, 68, 68, 0.7)', // Red for Rent
                            'rgba(212, 175, 55, 0.8)'  // Gold for Buy
                        ],
                        borderColor: [
                            'rgba(239, 68, 68, 1)',
                            'rgba(212, 175, 55, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: '10-Year Wealth Projection',
                            color: '#1e293b',
                            font: { size: 16 }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) { return '$' + value/1000 + 'k'; }
                            }
                        }
                    }
                }
            });
        }
    </script>

</body>
</html>
